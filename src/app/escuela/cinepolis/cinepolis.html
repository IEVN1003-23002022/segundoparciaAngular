<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
 
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Contact form
  </h1>
 
  <form [formGroup]="formulario">
 
    <!-- nombre -->
    <div class="mb-5">
 
      <label
        for="matricula"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>

      <input
        type="text" formControlName="nombre"
        id="matriucla"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
         focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matricula"
      >
      <br>

 
    <!-- cantidad compradores -->

      <label
        for="name"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Cantidad compradores
      </label>

      <input
        type="number" formControlName="nombre"
        id="name"
        name="name"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
         focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Cantidad compradores"
      >
      
 
    </div>
 

    <!-- correo -->


    <label
        for="correo"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Correo
      </label>

      <input
        type="text" formControlName="correo"
        id="materia"
        name="materia" 
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
         focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
      >
 
    <!-- materia -->

     <label
        for="Materia"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Materia
      </label>

      <input type="text" formControlName="materia" id="materia" name="materia"
        required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
         focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Materia">


         


<br>
<div>
        <button 
        type="submit" class="text-white bg-blue-700 hover:bg-blue-800
        focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 
        disabled:opacity-50 disabled:cursor-not-allowed"
        >
        Cargar
        </button>

        <button  type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none 
        focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed">
        Registrar
        </button>
 
 </div>

 <div>
 </div>
 
 

 

  </form>
 
</div>
